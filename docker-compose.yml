version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: predictive-dialer-postgres
    environment:
      POSTGRES_USER: predictive_dialer_user
      POSTGRES_PASSWORD: predictive_dialer_password
      POSTGRES_DB: predictive_dialer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictive_dialer_user -d predictive_dialer_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - predictive-dialer-net

  nats:
    image: nats:2-alpine
    container_name: predictive-dialer-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - predictive-dialer-net

  predictive-dialer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predictive-dialer-engine
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - DATABASE_URL=postgres://predictive_dialer_user:predictive_dialer_password@postgres:5432/predictive_dialer_db?sslmode=disable
      - NATS_URL=nats://nats:4222
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - predictive-dialer-net

  prometheus:
    image: prom/prometheus:latest
    container_name: predictive-dialer-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - predictive-dialer-net
    depends_on:
      - predictive-dialer

networks:
  predictive-dialer-net:
    driver: bridge

volumes:
  postgres_data:
