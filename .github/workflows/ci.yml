name: DialPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dialpulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply PostgreSQL Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=password psql -h localhost -U postgres -d dialpulse_test -f migrations/001_init.sql

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Unit & Live PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: "postgres://postgres:password@localhost:5432/dialpulse_test?sslmode=disable"
          REQUIRE_DB: "1"
        run: go test -v -race ./tests/...

      - name: Build Server Binary
        run: go build -v -o bin/dialpulse ./cmd/server
