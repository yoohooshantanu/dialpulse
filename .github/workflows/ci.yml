name: DialPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dialpulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
          for i in {1..30}; do
            if curl -sf http://localhost:8222/healthz; then
              echo "NATS JetStream is healthy and ready"
              break
            fi
            echo "Waiting for NATS /healthz..."
            sleep 1
          done

      - name: Apply PostgreSQL Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=password psql -h localhost -U postgres -d dialpulse_test -f migrations/001_init.sql
          PGPASSWORD=password psql -h localhost -U postgres -d dialpulse_test -f migrations/002_outbox.sql

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Unit & Live PostgreSQL & NATS Integration Tests
        env:
          TEST_DATABASE_URL: "postgres://postgres:password@localhost:5432/dialpulse_test?sslmode=disable"
          REQUIRE_DB: "1"
          TEST_NATS_URL: "nats://localhost:4222"
          REQUIRE_NATS: "1"
        run: |
          set -o pipefail
          go test -v -race ./tests/... 2>&1 | tee test.log

      - name: Annotate Failing Tests
        if: always()
        run: |
          while IFS= read -r line; do
            echo "::error title=TestFailure::$line"
          done < <(grep -A 5 -E "^(--- FAIL:|    outbox_test\.go:)" test.log || true)

      - name: Build Server Binary
        run: go build -v -o bin/dialpulse ./cmd/server
